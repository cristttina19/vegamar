# Automatic publishing: every push to main updates the web on GitHub Pages.
# Everything is published except git files, README, CLAUDE.md and the style configs.
name: Publicar web

on:
  push:
    branches: [main]
  workflow_dispatch: # also a "Run workflow" button in the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Copiar solo los archivos de la web
        run: |
          rsync -a --exclude='.git*' --exclude='.github' --exclude='*.md' \
            --exclude='.*rc*.json' --exclude='.htmlvalidate.json' ./ _site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
